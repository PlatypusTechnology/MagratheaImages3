          schema:
            oneOf:
              - type: integer
              - type: string
          description: Numeric image ID, or its UUID. When `force_uuid` is enabled, only the UUID form is accepted (400 otherwise).
          example: 42
      responses:
        "200":
          description: Image metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageDetailsResponse"
        "400":
