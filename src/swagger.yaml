          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Key does not match image (code 4032)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Image not found (4043), or public key not found (4041)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /image/{public_key}/{id}:
    get:
      tags: [images-secure]
      summary: View image — size from the query string
      description: |
        Serves the image at the size the query string gives: `size=WxH` (e.g. `800x600`), or
        `w` + `h` (aliases `width` + `height`). When `size` is present, `w`/`h` are ignored.

        By default the image is **cropped to fill exactly W×H**: scaled to cover the box, then an
        image wider than the box loses both sides evenly, and one taller than the box keeps its
        top. `fit=1` scales it to fit inside W×H instead; `stretch=1` distorts it to exactly W×H.

        With a dimension missing (`size=800`, `w=800` alone) or no size at all, the response is
        the **thumbnail**: a `thumb_size` square crop, not a fit. `size=raw` doesn't apply here
        (it's the thumbnail too): the original file is `/raw` or `/x/raw`.

        **Format:** `image/webp` when the instance has `webp_quick_access` on (a cached file is
        then served before the database is read), otherwise the original's format. Images that
        can't be resized (SVG) are always served as the original file (`image/svg+xml`), with
        every size and modifier ignored.
      operationId: viewImageSecure
      parameters:
        - name: public_key
          in: path
          required: true
          schema:
            type: string
          description: Public key
          example: "abc123def456"
        - name: id
          in: path
          required: true
          schema:
            oneOf:
              - type: integer
              - type: string
          description: Numeric image ID, or its UUID. When `force_uuid` is enabled, only the UUID form is accepted (400 otherwise).
          example: 42
        - name: size
          in: query
          schema:
            type: string
          description: "`WxH`, both integers. Takes precedence over `w`/`h`. One dimension only (`800`, `800x`): the thumbnail."
          example: "800x600"
        - name: w
          in: query
          schema:
            type: integer
          description: Width. Needs `h` too (without it, the thumbnail). Ignored when `size` is present.
        - name: width
          in: query
          schema:
            type: integer
          description: Alias of `w`, read only when `w` is absent.
        - name: h
          in: query
          schema:
            type: integer
          description: Height. Needs `w` too (without it, the thumbnail). Ignored when `size` is present.
        - name: height
          in: query
          schema:
            type: integer
          description: Alias of `h`, read only when `h` is absent.
        - $ref: "#/components/parameters/Fit"
        - $ref: "#/components/parameters/Stretch"
        - $ref: "#/components/parameters/Placeholder"
        - $ref: "#/components/parameters/Generate"
      responses:
        "200":
          description: "Image binary: `image/webp` with `webp_quick_access` on, otherwise the original's format; SVGs as the original file"
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        "400":
          description: "`force_uuid` enabled and `id` is not a UUID (code 4004)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Key does not match image (code 4032)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Image not found (4043), or public key not found (4041)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: "Image generation failed (5004), GD not installed (5002), or destination folder not writable (5003)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /image/{public_key}/{id}/x/{size}:
    get:
      tags: [images-secure]
      summary: View image at explicit size
      description: |
        Serves the image at `{size}` = `WxH` (both integers, e.g. `800x600`). The path size wins
        over any `size`/`w`/`h` in the query.

        By default the image is **cropped to fill exactly W×H**: scaled to cover the box, then an
        image wider than the box loses both sides evenly, and one taller than the box keeps its
        top. `fit=1` scales it to fit inside W×H instead (the response is *at most* W×H);
        `stretch=1` distorts it to exactly W×H.

        A single dimension (`/x/800`, `/x/800x`) returns the **thumbnail**: a `thumb_size` square
        crop, not a fit. `/x/raw` serves the original file, like `/raw`. A non-numeric dimension
        (`/x/800x600-s`) answers 500.

        **Format:** as `/image/{public_key}/{id}`: `image/webp` with `webp_quick_access` on,
        otherwise the original's; SVGs are always the original file.
      operationId: viewImageAtSizeSecure
      parameters:
        - name: public_key
          in: path
          required: true
          schema:
            type: string
          example: "abc123def456"
        - name: id
          in: path
          required: true
          schema:
            oneOf:
              - type: integer
              - type: string
          description: Numeric image ID, or its UUID. When `force_uuid` is enabled, only the UUID form is accepted (400 otherwise).
          example: 42
        - name: size
          in: path
          required: true
          schema:
            type: string
          description: "`WxH` (both integers), or `raw` for the original file"
          example: "800x600"
        - $ref: "#/components/parameters/Fit"
        - $ref: "#/components/parameters/Stretch"
        - $ref: "#/components/parameters/Placeholder"
        - $ref: "#/components/parameters/Generate"
      responses:
        "200":
          description: "Resized image binary: `image/webp` with `webp_quick_access` on, otherwise the original's format; SVGs (and `/x/raw`) as the original file"
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        "400":
          description: "`force_uuid` enabled and `id` is not a UUID (code 4004)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Key does not match image (code 4032)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Image not found (4043), or public key not found (4041)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: "Image generation failed (5004), GD not installed (5002), or destination folder not writable (5003)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

