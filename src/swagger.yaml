              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Key does not match image (code 4032)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Image not found (4043), or public key not found (4041)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: "Image generation failed (5004), GD not installed (5002), or destination folder not writable (5003)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /image/{public_key}/{id}/preview/{size}:
    get:
      tags: [images-secure]
      summary: Preview image at size without caching
      description: |
        Renders the image without reading or writing the cache: always generated, never saved.
        It's for trying sizes and modifiers out, not for serving.

        `{size}`: `WxH` (both required), `thumb` or `raw`. `fit`, `stretch` and `placeholder` work
        as on `/x/{size}`, except that `stretch` here takes any truthy value. `generate` doesn't
        apply (it always generates).

        **Format:** always the original's (never converted to webp). SVGs are served as the
        original file. `debug=1` returns the resizer's steps as JSON instead of the image.
      operationId: previewImageSecure
      parameters:
        - name: public_key
          in: path
          required: true
          schema:
            type: string
          example: "abc123def456"
        - name: id
          in: path
          required: true
          schema:
            oneOf:
              - type: integer
              - type: string
          description: Numeric image ID, or its UUID. When `force_uuid` is enabled, only the UUID form is accepted (400 otherwise).
          example: 42
        - name: size
          in: path
          required: true
          schema:
            type: string
          description: "`WxH` (the `x` is case-insensitive), `thumb` or `raw`"
          example: "400x300"
        - $ref: "#/components/parameters/Fit"
        - name: stretch
          in: query
          schema:
            type: integer
            enum: [0, 1]
            default: 0
          description: "Any truthy value: resize to exactly W×H, ignoring the ratio (distorted). Ignored when `fit=1`. Before 3.7.0 it returned the default crop."
        - $ref: "#/components/parameters/Placeholder"
        - name: debug
          in: query
          schema:
            type: integer
            enum: [0, 1]
            default: 0
          description: "Any truthy value: return the resizer's steps as JSON (`DebugResizeResponse`) instead of the image"
      responses:
        "200":
          description: Preview image binary in the original's format, or the resizer's steps as JSON when `debug=1`
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/DebugResizeResponse"
        "400":
          description: "`force_uuid` enabled and `id` is not a UUID (code 4004)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Key does not match image (code 4032)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Image not found (4043), or public key not found (4041)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: "Image generation failed (5004), GD not installed (5002), or destination folder not writable (5003)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
